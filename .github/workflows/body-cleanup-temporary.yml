name: Final B body wording
on:
  push:
    branches: [docs/b-current-handoff-20261007]
    paths: [.github/workflows/body-cleanup-temporary.yml]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  correct:
    if: ${{ github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {ref: '${{ github.sha }}'}
      - name: Correct reviewed B bodies and verify exact readback
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/maintenance
          cat > .github/maintenance/reviewed-input.json <<'JSON'
          {"schema_version":1,"repository":"seokpan/seokpan-hybrid-gitops","files":{},"metadata":[{"endpoint":"issues/10","before_sha256":"50a23ecd60039e7d2d7b508776041a564409ca6c452e19bf7f49e93b62ff54f0","after_sha256":"cea34af0d7570cb026ef7f0943d26a0a26322cd8bf4eb863917b2b5d22bc2bd5","edits":[[129,130,"새 [Data Run](https://github.com/seokpan/seokpan-hybrid-docs/blob/main/evidence/T18/fixture-20261005-01/summary.md)·[Backend Run](https://github.com/seokpan/seokpan-hybrid-docs/blob/main/evidence/T18/business-fixture-20261005-01/summary.md)은 Codex가 수행한 부분 합성 실행이며 C/D가 실행·리뷰·수신했다고 기록하지 않습니다. h-infra PR #29가 Source 원본입니다.\n"]]},{"endpoint":"issues/9","before_sha256":"97b4c2cb6577953eb5688966375fb580c53a72404c5b16a3cc6dc0fc2bd1b503","after_sha256":"e848238477e310d9178ea3aa809725665e67fe6b50e76b24652b094aebdbff38","edits":[[118,119,"원 lab 출처 259e73b0fac1af40f7bb7b43bd1982410d1df150은 reference Branch에 유지하며 Runtime PASS로 승계하지 않습니다. RTO30분/RPO90분/1시간 Backup·복원 구조·1차 자산·Namespace/Prune/finalizer는 유지합니다. B 담당 Source·로컬 검사와 실제 실행·수신을 구분합니다.\n"]]}]}
          JSON
          curl -fsSL --retry 2 https://raw.githubusercontent.com/seokpan/seokpan-hybrid-docs/a98b14a509078c34581b93dae7d8fb12f02d1684/.github/maintenance/apply-reviewed-resume.py -o "$RUNNER_TEMP/helper.py"
          test "$(git hash-object "$RUNNER_TEMP/helper.py")" = e06ac3181d83131c2cc986c0ad58bb3e8ae39d0d
          python3 "$RUNNER_TEMP/helper.py"
          rm .github/maintenance/reviewed-input.json
          git diff --exit-code
          git rm .github/workflows/body-cleanup-temporary.yml
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: finish objective B body wording and remove temporary workflow'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > "$RUNNER_TEMP/reviewed-resume-report/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: body-wording-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-resume-report
          retention-days: 14
