name: GitOps source validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main, implementation/app-lab-recovery-20261002]
    paths:
      - 'apps/**'
      - 'clusters/**'
      - 'platform/**'
      - 'operations/**'
      - 'handoff/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/gitops-static-validation.yml'
  push:
    # Candidate branches are validated by pull_request; avoid duplicate cancelled checks.
    branches: [main]
    paths:
      - 'apps/**'
      - 'clusters/**'
      - 'platform/**'
      - 'operations/**'
      - 'handoff/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/gitops-static-validation.yml'

permissions:
  contents: read

concurrency:
  group: gitops-static-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    # Public standard runners are free; hold this job if visibility changes.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Checkout the submitted commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install checksum-verified Kustomize v5.7.1
        run: |
          set -euo pipefail
          gitops_download_dir="${RUNNER_TEMP}/gitops-kustomize-download"
          gitops_binary_dir="${RUNNER_TEMP}/gitops-kustomize-bin"
          mkdir -p "$gitops_download_dir" "$gitops_binary_dir"
          cd "$gitops_download_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz \
            --output kustomize_v5.7.1_linux_amd64.tar.gz
          printf '%s  %s\n' \
            ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8 \
            kustomize_v5.7.1_linux_amd64.tar.gz | sha256sum -c -
          tar -xzf kustomize_v5.7.1_linux_amd64.tar.gz -C "$gitops_binary_dir" kustomize
          test "$("$gitops_binary_dir/kustomize" version)" = v5.7.1
          printf 'KUSTOMIZE=%s\n' "$gitops_binary_dir/kustomize" >> "$GITHUB_ENV"

      - name: Prepare isolated Python test dependencies
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          gitops_venv="${RUNNER_TEMP}/gitops-test-venv"
          python3 -m venv "$gitops_venv"
          "$gitops_venv/bin/python" -m pip install --disable-pip-version-check \
            --no-cache-dir --only-binary=:all: PyYAML==6.0.2
          "$gitops_venv/bin/python" -c 'import yaml; assert yaml.__version__ == "6.0.2"; print("PyYAML:", yaml.__version__)'
          printf 'GITOPS_TEST_PYTHON=%s\n' "$gitops_venv/bin/python" >> "$GITHUB_ENV"

      - name: Check Python syntax and expected source suite
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          "$GITOPS_TEST_PYTHON" - "${RUNNER_TEMP}/gitops-suite.json" <<'PY'
          import json, os, pathlib, re, sys, unittest
          root = pathlib.Path.cwd()
          for path in sorted((root / "tools").glob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          cloud_source = (root / "apps/overlays/cloud").is_dir()
          cloud_tests = (root / "tools/test_cloud_manifests.py").is_file()
          cloud_branch = os.environ["SOURCE_BRANCH"] == "implementation/cloud-overlay-candidate-20261002"
          if cloud_branch and not (cloud_source and cloud_tests):
              raise SystemExit("Cloud stack must retain its source and test suite")
          if cloud_source != cloud_tests:
              raise SystemExit("Cloud source and test suite must be present together")
          makefile = (root / "Makefile").read_text(encoding="utf-8")
          pattern = re.search(r"unittest discover -s tools -p '([^']+)'", makefile)
          if pattern is None:
              raise SystemExit("Expected existing Makefile unittest target")
          loader = unittest.TestLoader()
          suite = loader.discover("tools", pattern=pattern.group(1))
          app_count = loader.loadTestsFromName("test_app_manifests").countTestCases()
          cloud_count = loader.loadTestsFromName("test_cloud_manifests").countTestCases() if cloud_tests else 0
          ocp_count = loader.loadTestsFromName("test_ocp_control_manifests").countTestCases()
          safety_count = loader.loadTestsFromName("test_release_safety_manifests").countTestCases()
          minimum = 39 if cloud_tests else 30
          if app_count < 18 or ocp_count < 6 or safety_count < 6 or (cloud_tests and cloud_count < 9) or suite.countTestCases() < minimum:
              raise SystemExit("Expected source tests are missing or not discovered")
          record = {"source": os.popen("git rev-parse HEAD").read().strip(),
                    "pattern": pattern.group(1), "discovered": suite.countTestCases(),
                    "app": app_count, "ocp": ocp_count, "release_safety": safety_count,
                    "cloud": cloud_count, "minimum": minimum}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(record), encoding="utf-8")
          print(json.dumps(record))
          PY

      - name: Run the existing Kustomize source checks
        run: |
          set -euo pipefail
          make test PYTHON="$GITOPS_TEST_PYTHON" KUSTOMIZE="$KUSTOMIZE" \
            2>&1 | tee "${RUNNER_TEMP}/gitops-tests.log"
          "$GITOPS_TEST_PYTHON" - "${RUNNER_TEMP}/gitops-suite.json" "${RUNNER_TEMP}/gitops-tests.log" <<'PY'
          import json, pathlib, re, sys
          suite = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          log = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          counts = re.findall(r"(?m)^Ran ([0-9]+) tests? in ", log)
          if len(counts) != 1 or int(counts[0]) != suite["discovered"]:
              raise SystemExit("Executed test count does not match discovered source suite")
          if int(counts[0]) < suite["minimum"] or re.search(r"(?m)^OK$", log) is None:
              raise SystemExit("Source tests did not pass without skips or expected failures")
          print("Executed source tests:", counts[0])
          PY

      - name: Preserve diagnostic OCP Source renders
        run: |
          set -euo pipefail
          "$GITOPS_TEST_PYTHON" - "${RUNNER_TEMP}/ocp-source-handoff" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          import yaml
          root = pathlib.Path.cwd()
          output = pathlib.Path(sys.argv[1])
          output.mkdir(exist_ok=False)
          paths = (
              "apps/base", "apps/overlays/lab", "clusters/ocp-lab/reuse",
              "clusters/ocp-lab/bootstrap", "clusters/ocp-lab/root",
              "clusters/ocp-lab/new-namespace", "platform/ocp-lab/new-namespace",
              "operations/ocp-lab/migration",
          )
          binary = os.environ["KUSTOMIZE"]
          version = subprocess.run([binary, "version"], check=True,
                                   capture_output=True, text=True).stdout.strip()
          if version != "v5.7.1":
              raise SystemExit("Expected the checksum-verified Kustomize v5.7.1")
          head = subprocess.run(["git", "rev-parse", "HEAD"], check=True,
                                capture_output=True, text=True).stdout.strip()
          tree = subprocess.run(["git", "rev-parse", "HEAD^{tree}"], check=True,
                                capture_output=True, text=True).stdout.strip()
          records = []
          sums = []
          for path in paths:
              rendered = subprocess.run([binary, "build", str(root / path)],
                                        check=True, capture_output=True).stdout
              objects = list(yaml.safe_load_all(rendered))
              if not objects or any(not isinstance(obj, dict) for obj in objects):
                  raise SystemExit("Invalid rendered YAML: " + path)
              if any(obj.get("kind") == "Secret" for obj in objects):
                  raise SystemExit("Do not publish Secret objects in diagnostic renders")
              for obj in objects:
                  kind = obj.get("kind")
                  if kind in {"Deployment", "StatefulSet"} and obj["spec"].get("replicas") != 0:
                      raise SystemExit("Diagnostic workloads must remain held at zero replicas")
                  if kind == "Application":
                      if "automated" in obj["spec"].get("syncPolicy", {}) or obj["metadata"].get("finalizers"):
                          raise SystemExit("Diagnostic Applications must remain manual/non-cascading")
                  if kind == "Job":
                      container, = obj["spec"]["template"]["spec"]["containers"]
                      if obj["spec"].get("suspend") is not True or container.get("args", [None])[0] != "current" or "--execute" in container["args"]:
                          raise SystemExit("Diagnostic Migration must remain suspended/current")
              name = path.replace("/", "_") + ".yaml"
              digest = hashlib.sha256(rendered).hexdigest()
              (output / name).write_bytes(rendered)
              sums.append(digest + "  " + name)
              records.append({"path": path, "file": name, "sha256": digest,
                              "bytes": len(rendered), "object_count": len(objects),
                              "objects": [{"apiVersion": obj["apiVersion"], "kind": obj["kind"],
                                           "namespace": obj["metadata"].get("namespace"),
                                           "name": obj["metadata"]["name"]} for obj in objects]})
          record = {"scope": "DIAGNOSTIC_SOURCE_ONLY_NOT_DEPLOYABLE",
                    "source_sha": head, "source_tree": tree, "kustomize": version,
                    "python": sys.version.split()[0], "pyyaml": yaml.__version__,
                    "runtime": "NOT_RUN", "renders": records}
          (output / "source-manifest.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (output / "SHA256SUMS").write_text("\n".join(sums) + "\n", encoding="utf-8")
          (output / "README.md").write_text(
              "# Diagnostic OCP Source renders — NOT DEPLOYABLE\n\n"
              "Source: " + head + "\n\n"
              "This artifact preserves eight Kustomize source previews and their hashes/object inventory.\n"
              "INPUT_REQUIRED/.invalid, zero replicas, manual Applications and suspended Migration remain.\n"
              "Do not Apply/Sync these previews. No cluster, registry, Secret, DB, AWS or runtime acceptance was performed.\n"
              "Path alternatives are source comparisons, not a sequence to apply together.\n"
              "Source submission, recipient acceptance and actual Runtime Run are separate records.\n",
              encoding="utf-8")
          print(json.dumps({"source": head, "diagnostic_paths": len(records),
                            "objects": sum(row["object_count"] for row in records),
                            "scope": record["scope"]}))
          PY

      - name: Confirm source remained unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          {
            printf 'Source commit: %s\n' "$(git rev-parse HEAD)"
            printf 'Kustomize: %s\n' "$("$KUSTOMIZE" version)"
            printf 'Scope: local source/render checks only; no cluster, registry, Cloud, deployment or runtime acceptance.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic OCP Source handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocp-source-handoff-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ocp-source-handoff/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false
