name: Link agreed lab path A
on:
  push:
    branches: [feat/b-path-a-registration-check-20261007]
    paths: [.github/workflows/path-a-note-temporary.yml]
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.actor == 'tjung03' && github.repository == 'seokpan/seokpan-hybrid-gitops' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Insert only the current-path pointer and preserve prior body
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 66023d32296a84f454d482cbeb6e812919da5dae
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('clusters/ocp-lab/README.md');old=p.read_text()
          assert hashlib.sha256(old.encode()).hexdigest()=='a32ce41df38003552f8ea5feed1aa0a52e010a797f5764f8c5c8b737c6ec6852'
          note='\n**2026-10-07 현재 선택:** [경로 A 등록·검사 안내](../../handoff/OCP_PATH_A_REGISTRATION.md)를 따른다. 기존 `openshift-gitops`에 제한 AppProject/Application 각 1개만 등록하며 새 Root/Controller를 추가하지 않는다. 아래 경로 비교는 보존된 후보이고, 실제 등록값은 Workload 입력 PR 병합 후 그 전체 SHA에 고정하는 별도 PR에서 반영한다. 현재 placeholder Source는 실행하지 않는다.\n'
          new=old.split('\n',1)[0]+'\n'+note+old.split('\n',1)[1]
          assert hashlib.sha256(new.encode()).hexdigest()=='abde54eeec7b1bd12dc44e68f8b7866c109a4378289c26b3a51b4bf042149e07'
          p.write_text(new)
          PY
          git add clusters/ocp-lab/README.md
          git rm .github/workflows/path-a-note-temporary.yml
          test "$(git diff --cached --name-only de130af839626c9d0a030580693a4060c41c9abd | wc -l)" -eq 4
          git diff --cached --check
          git diff --cached --exit-code de130af839626c9d0a030580693a4060c41c9abd -- apps platform clusters/ocp-lab/root .github/workflows Makefile
          test "$(git ls-remote origin refs/heads/feat/b-path-a-registration-check-20261007 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: link current path A while preserving original alternatives and held manifests'
          git push origin HEAD:refs/heads/feat/b-path-a-registration-check-20261007
          mkdir "$RUNNER_TEMP/path-a-note"
          git rev-parse HEAD > "$RUNNER_TEMP/path-a-note/source-sha.txt"
          git bundle create "$RUNNER_TEMP/path-a-note/source.bundle" HEAD
          git diff de130af839626c9d0a030580693a4060c41c9abd HEAD > "$RUNNER_TEMP/path-a-note/changes.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: path-a-note-${{ github.run_id }}
          path: ${{ runner.temp }}/path-a-note/
          retention-days: 30
          if-no-files-found: error
