apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    seokpan.io/release-state: input-required-no-runtime-validation
spec:
  # A source candidate, not an activated Release. The environment owner replaces
  # this hold only after Image/Secret/CA/Schema/Context review and manual Sync.
  replicas: 0
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: seokpan-backend:INPUT_REQUIRED
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: SEOKPAN_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SEOKPAN_IDENTITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-db-runtime
                  key: SEOKPAN_IDENTITY_DATABASE_URL
            - name: SEOKPAN_GAME_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-db-runtime
                  key: SEOKPAN_GAME_DATABASE_URL
            - name: SEOKPAN_REDIS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-redis-runtime
                  key: SEOKPAN_REDIS_AUTH_TOKEN
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: database-ca
              mountPath: /etc/seokpan/database-ca
              readOnly: true
            - name: redis-ca
              mountPath: /etc/seokpan/redis-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: database-ca
          configMap:
            name: backend-database-ca
            items: [{key: ca.crt, path: ca.crt}]
        - name: redis-ca
          configMap:
            name: backend-redis-ca
            items: [{key: ca.crt, path: ca.crt}]
