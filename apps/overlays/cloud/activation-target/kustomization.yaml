apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud-input-required
# A STATIC TARGET PREVIEW, not a Cloud Application targetRevision/path.
# Input-required endpoints/images and draft annotations are still inherited.
resources:
  - ../runtime
  - pdb.yaml
  - hpa.yaml
# The HPA owns backend scale, so the backend Deployment carries no replicas field
# (the base hold of 0 is removed below). Frontend stays fixed. At real activation
# Argo must also ignore /spec/replicas (see README).
replicas:
  - name: frontend
    count: 3
patches:
  - path: topology.yaml
  - target: {kind: Deployment, name: backend}
    patch: |-
      - op: remove
        path: /spec/replicas
