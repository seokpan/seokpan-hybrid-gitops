apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Actual Cloud namespace/owner input is not yet handed over. This does not
# create a Namespace or grant an Argo controller access to it.
namespace: cloud-input-required
resources:
  - ../../../base
  - routes.yaml
images:
  # Consume foundation's ecr_repository_urls[backend/frontend] after Apply,
  # then use approved component digests. Never borrow Harbor/CI login tokens.
  - name: seokpan-backend
    newName: ecr-input-required.invalid/seokpan-fnd-backend
    newTag: INPUT_REQUIRED
  - name: seokpan-frontend
    newName: ecr-input-required.invalid/seokpan-fnd-frontend
    newTag: INPUT_REQUIRED
# envFrom is read on Pod startup: keep the generated content hash so a
# reviewed runtime configuration change also changes the Pod template ref.
configMapGenerator:
  - name: backend-config
    behavior: merge
    envs: [runtime.env]
