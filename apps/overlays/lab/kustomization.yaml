apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# GitOps #5's isolated target. No Namespace object or ownership label mutation.
namespace: seokpan-argotest
resources:
  - ../../base
  - routes.yaml
images:
  - name: seokpan-backend
    newName: image-registry.openshift-image-registry.svc:5000/seokpan-argotest/backend
    digest: sha256:cbb7452c28f1dfe3533358916e8d0432cd65aa10865842451ab026972b55dae6
  - name: seokpan-frontend
    newName: image-registry.openshift-image-registry.svc:5000/seokpan-argotest/frontend
    digest: sha256:e9fb167a9afd753f5ca4ef1644efd9d0a310b82cc42d4331ebaa65bbf4bfa4d9
# Internal Registry in the same namespace; D reported default-SA Pull success.
patches:
  # 작성자: 정태훈 / 작성 날짜: 2026/10/06
  # Initial lab candidates from GitOps #14; replicas stay held at zero.
  # D must check actual scheduling/pressure during the staged first startup.
  - target: {kind: Deployment, name: backend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                resources:
                  requests: {cpu: 100m, memory: 128Mi}
                  limits: {cpu: 500m, memory: 256Mi}
  - target: {kind: Deployment, name: frontend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests: {cpu: 25m, memory: 32Mi}
                  limits: {cpu: 250m, memory: 64Mi}
# Keep the generated ConfigMap content hash: envFrom inputs are loaded when
# Pods start, so a configuration change must also change the Pod template ref.
configMapGenerator:
  - name: backend-config
    behavior: merge
    envs: [runtime.env]
