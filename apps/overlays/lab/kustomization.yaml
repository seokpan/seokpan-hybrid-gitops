apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# GitOps #5's isolated target. No Namespace object or ownership label mutation.
namespace: seokpan-argotest
resources:
  - ../../base
  - routes.yaml
  - redis.yaml
images:
  - name: seokpan-backend
    newName: image-registry.openshift-image-registry.svc:5000/seokpan-argotest/backend
    digest: sha256:ab0e141abbdf43c5589f9b0af7df38f168044541deec1e10ec7295cb394f4290
  - name: seokpan-frontend
    newName: image-registry.openshift-image-registry.svc:5000/seokpan-argotest/frontend
    digest: sha256:d26d5385a02ed557863abcba9b3e3cde1fac3ceaf2671f170cdc081729620ac4
  # Lab-only Valkey 7.2.14 index digest, copied to the lab internal Registry with
  # the digest preserved (GitOps #14). Same-Namespace default ServiceAccount pull.
  - name: seokpan-lab-valkey
    newName: image-registry.openshift-image-registry.svc:5000/seokpan-argotest/valkey
    digest: sha256:ef0f9fb533b1f06fb7aba6478d758ca1c077d49e2bcb2b4365a4ea7f50b6d42e
# Internal Registry in the same namespace; D reported default-SA Pull success.
patches:
  # 작성자: 정태훈 / 작성 날짜: 2026/10/06
  # Initial lab candidates from GitOps #14. Stage 2 (GitOps #26): lab FE/BE replicas 1,
  # release-state source-reviewed-runtime-unverified. Base and recovery stay held at zero.
  # D must check actual scheduling/pressure during the staged first startup.
  - target: {kind: Deployment, name: backend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        annotations:
          seokpan.io/release-state: source-reviewed-runtime-unverified
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: backend
                resources:
                  requests: {cpu: 100m, memory: 128Mi}
                  limits: {cpu: 500m, memory: 256Mi}
  - target: {kind: Deployment, name: frontend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
        annotations:
          seokpan.io/release-state: source-reviewed-runtime-unverified
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests: {cpu: 25m, memory: 32Mi}
                  limits: {cpu: 250m, memory: 64Mi}
# Keep the generated ConfigMap content hash: envFrom inputs are loaded when
# Pods start, so a configuration change must also change the Pod template ref.
configMapGenerator:
  - name: backend-config
    behavior: merge
    envs: [runtime.env]
  - name: lab-redis-config
    files: [redis.conf]
  - name: lab-redis-runtime
    files: [redis-runtime.conf]
