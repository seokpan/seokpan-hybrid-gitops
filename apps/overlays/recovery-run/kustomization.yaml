# 작성자: 최유준
# 작성 날짜: 2026/10/19
# Recovery "Valkey 보존 전용" 적용 산출물. 이미 실행 중인 recovery-redis 1개를 유지하는 것이 유일한 목적이다.
# 출력은 정확히 3개 객체(StatefulSet recovery-redis replicas 1, Service recovery-redis, ConfigMap recovery-redis-config-<hash>)이며
# FE/BE, 진입(Gateway/HTTPRoute/진입 NP), 기존 NetworkPolicy, backend-config는 모두 제외한다.
# ../recovery를 상속하되 아래 delete 패치로 Valkey 외 객체를 제거한다. 나중에 ../recovery에 객체가 추가되면
# 이 출력에 섞이므로 tools/test_app_manifests.py가 정확한 3개 객체가 아니면 실패한다(허용 목록 방식).
# 보류용 원본(apps/overlays/recovery, redis.yaml replicas 0)은 바꾸지 않는다. 전체 Recovery 산출물을 적용하는 용도가 아니다.
# 적용 전 live Diff에서 Valkey scale-down 또는 Pod template/image/volume 변경이 보이면 적용하지 않는다:
#   kustomize build apps/overlays/recovery-run | kubectl diff -f -
# 주의: 원본의 runtime-config ConfigMap 참조가 자리표시자(-input-required)라 live와 다를 수 있다.
#       그 경우 이 StatefulSet은 적용하지 않고 live 상태를 먼저 Source에 반영해야 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../recovery
patches:
  - target: {kind: StatefulSet, name: recovery-redis}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: Deployment}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-used
  - target: {kind: Service, name: "^(frontend|backend)$"}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: not-used
  - target: {kind: ConfigMap, name: "^backend-config(-.*)?$"}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: not-used
  - target: {kind: NetworkPolicy}
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: not-used
  - target: {kind: Gateway}
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: not-used
  - target: {kind: HTTPRoute}
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: not-used
