apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Selected isolated target; no Namespace object or activation is supplied.
namespace: seokpan-recovery
resources:
  - ../../base
  - redis.yaml
  - networkpolicy.yaml
  - entry.yaml
images:
  - name: seokpan-backend
    newName: harbor.seokpan.soldesk.store/seokpan-hybrid/backend
    digest: sha256:733f52a6f5a53c31e792cbe1d254221ff8ff86828e8c3afdc65d207e2e5fb18d
  - name: seokpan-frontend
    newName: harbor.seokpan.soldesk.store/seokpan-hybrid/frontend
    digest: sha256:7068a36f55427639b7b7bf8a9c5795689b891e7ec334bfd306d8cd03c5f049ff
  - name: seokpan-recovery-redis
    newName: harbor.seokpan.soldesk.store/seokpan-hybrid/valkey
    # Valkey 7.2.14 Index copied from docker.io with the digest preserved (#10).
    # Supplying the Digest is not evidence of Pull, CA trust or engine start.
    digest: sha256:ef0f9fb533b1f06fb7aba6478d758ca1c077d49e2bcb2b4365a4ea7f50b6d42e
patches:
  - path: release-source.yaml
  - path: resources.yaml
  - target: {kind: Deployment}
    path: registry-pull.yaml
# Keep the generated ConfigMap content hash. External Secret/CA inputs remain
# owner-supplied names and require a separately approved consumer restart.
configMapGenerator:
  - name: backend-config
    behavior: merge
    envs: [runtime.env]
  - name: recovery-redis-config
    files: [redis.conf]
