apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Replace only after A/C/B confirm the isolated Recovery namespace/platform.
namespace: recovery-input-required
resources:
  - ../../base
images:
  - name: seokpan-backend
    newName: recovery-harbor-input-required.invalid/backend
    newTag: INPUT_REQUIRED
  - name: seokpan-frontend
    newName: recovery-harbor-input-required.invalid/frontend
    newTag: INPUT_REQUIRED
patches:
  - target: {kind: Deployment}
    path: registry-pull.yaml
# Keep the generated ConfigMap content hash. External Secret/CA inputs remain
# owner-supplied names and require a separately approved consumer restart.
configMapGenerator:
  - name: backend-config
    behavior: merge
    envs: [runtime.env]
