apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Replace only after A/C/B confirm the isolated Recovery namespace/platform.
namespace: recovery-input-required
resources:
  - ../../base
  - redis.yaml
images:
  - name: seokpan-backend
    newName: harbor.seokpan.soldesk.store/seokpan-hybrid/backend
    digest: sha256:41a442deba498b0343e84fbc0a89c417afa018d32d64e3ee2eab02a12ba8541f
  - name: seokpan-frontend
    newName: harbor.seokpan.soldesk.store/seokpan-hybrid/frontend
    digest: sha256:25e26db371194d34a5a4d1f81603786e5eab8aac02a41db06da8b9b8e94818ee
  - name: seokpan-recovery-redis
    newName: recovery-harbor-input-required.invalid/redis
    newTag: INPUT_REQUIRED
patches:
  - target: {kind: Deployment}
    path: registry-pull.yaml
# Keep the generated ConfigMap content hash. External Secret/CA inputs remain
# owner-supplied names and require a separately approved consumer restart.
configMapGenerator:
  - name: backend-config
    behavior: merge
    envs: [runtime.env]
  - name: recovery-redis-config
    files: [redis.conf]
