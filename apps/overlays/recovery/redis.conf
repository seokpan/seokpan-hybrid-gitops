# Non-secret Source. External C includes must exist before the runtime can start.
# C supplies storage/persistence/memory settings; no policy values are chosen here.
include /etc/seokpan/redis-runtime/redis-runtime.conf
# C supplies requirepass for the same local token revision as backend-redis-runtime.
# This file contains no password and does not generate or print one.
include /etc/seokpan/redis-server-auth/redis-auth.conf
# Fixed transport follows the external includes so they cannot enable plaintext.
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /etc/seokpan/redis-server-tls/tls.crt
tls-key-file /etc/seokpan/redis-server-tls/tls.key
tls-ca-cert-file /etc/seokpan/redis-server-tls/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
daemonize no
logfile ""
