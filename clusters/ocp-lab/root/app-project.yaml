# Source review candidate. Resolve input/ownership and review before any Apply/Sync.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: seokpan-ocp-lab-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    seokpan.io/release-state: source-reviewed-runtime-unverified
spec:
  description: Manual OCP-lab source candidate; actual Controller/Owner inputs required.
  sourceRepos:
  - https://github.com/seokpan/seokpan-hybrid-gitops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: seokpan-argotest
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: ''
    kind: Service
  - group: ''
    kind: ConfigMap
  - group: route.openshift.io
    kind: Route
  clusterResourceBlacklist:
  - group: '*'
    kind: '*'
