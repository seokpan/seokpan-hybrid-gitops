# Source review candidate. Resolve input/ownership and review before any Apply/Sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seokpan-ocp-lab-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    seokpan.io/release-state: input-required-no-runtime-validation
spec:
  project: seokpan-ocp-lab-app
  source:
    repoURL: https://github.com/seokpan/seokpan-hybrid-gitops.git
    targetRevision: 244b48b885d7ac645c402e561a032ae65a8f3461
    path: apps/overlays/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: seokpan-argotest
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
