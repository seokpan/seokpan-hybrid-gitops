# Source review candidate. Resolve input/ownership and review before any Apply/Sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seokpan-ocp-lab-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    seokpan.io/release-state: source-reviewed-runtime-unverified
spec:
  project: seokpan-ocp-lab-app
  source:
    repoURL: https://github.com/seokpan/seokpan-hybrid-gitops.git
    targetRevision: bfee2669e62bf823969ce224e5599eccace5d024
    path: apps/overlays/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: seokpan-argotest
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - Prune=false
    - Delete=false
