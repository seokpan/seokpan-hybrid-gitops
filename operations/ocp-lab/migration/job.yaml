# Source review candidate. Resolve input/ownership and review before any Apply/Sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: seokpan-migration-input-required
  namespace: seokpan-argotest
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    seokpan.io/release-state: input-required-no-runtime-validation
spec:
  suspend: true
  # Five minutes is an initial ceiling for the held read-only `current` check,
  # not an approved DDL execution budget or a recovery target. The reviewed
  # active Job must use C's explicit deadline and recheck partial results after
  # timeout before any retry; terminating a Job does not roll back DB changes.
  activeDeadlineSeconds: 300
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seokpan-migration
    spec:
      restartPolicy: Never
      # Same internal Registry/digest as lab App; default-SA Pull was reported by D.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migration
        image: image-registry.openshift-image-registry.svc:5000/seokpan-argotest/backend@sha256:cbb7452c28f1dfe3533358916e8d0432cd65aa10865842451ab026972b55dae6
        imagePullPolicy: IfNotPresent
        # 작성자: 정태훈 / 작성 날짜: 2026/10/06
        # Unmeasured first-lab candidate; remains suspended/read-only current.
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        workingDir: /app
        command:
        - seokpan-migration-gate
        args:
        - current
        - --expect-host
        - DB_HOST_INPUT_REQUIRED
        - --expect-port
        - '3306'
        - --expect-database
        - DB_NAME_INPUT_REQUIRED
        envFrom:
        - configMapRef:
            name: backend-config-input-required
        env:
        - name: SEOKPAN_MIGRATION_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-db-migration
              key: SEOKPAN_MIGRATION_DATABASE_URL
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: database-ca
          mountPath: /etc/seokpan/database-ca
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: database-ca
        configMap:
          name: backend-database-ca
          items:
          - key: ca.crt
            path: ca.crt
