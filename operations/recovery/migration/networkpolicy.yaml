# 작성자: 최유준
# 작성 날짜: 2026/10/16
# Migration Job 전용 NP. Backend 라벨을 빌리지 않아 Valkey 접근을 상속하지 않는다.
# 허용: 목적 DB 192.168.54.60/32 TCP3306, CoreDNS UDP/TCP53. Ingress 없음.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recovery-migration
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: seokpan-migration}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock: {cidr: 192.168.54.60/32}
      ports: [{protocol: TCP, port: 3306}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
