# 작성자: 최유준 / 작성 날짜: 2026-10-15
# 기존 기본 차단을 유지하고 UWM 수집원 → Backend metrics 포트만 추가 허용 (허용은 합산됨)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seokpan-uwm-to-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
          podSelector:                      # 같은 peer의 AND 조건
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: user-workload
      ports:
        - protocol: TCP
          port: 8000
