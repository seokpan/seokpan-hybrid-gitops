# Owner: 정태훈
# Scope: Kubernetes / Service Platform
# Project: 石나가는 판단
# Purpose: Redis AOF Runtime 설정
# Created: 2026-08-29
# Updated: 2026-09-01

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: platform
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379

    appendonly yes
    appendfsync everysec

    dir /data

    save ""

    maxmemory 1gb
    maxmemory-policy noeviction
