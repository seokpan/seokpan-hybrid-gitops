# Scope: Kubernetes / Service Platform
# Project: 石나가는 판단
# Purpose: Redis StatefulSet 네트워크 및 Backend 접근 Service 구성
# Created: 2026-08-29
# Updated: 2026-08-29

apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: platform
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
