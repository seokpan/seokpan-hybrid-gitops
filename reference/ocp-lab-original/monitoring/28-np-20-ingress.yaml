# 실습 검증용 NetworkPolicy (base 반영은 네트워크 담당과 협의)
# 20: OpenShift Router에서 들어오는 트래픽 허용
# - IngressController가 HostNetwork 방식이라 router Pod IP가 아닌 노드 IP로 들어옴
# - OVN-Kubernetes 전용 라벨 policy-group.network.openshift.io/ingress 로 허용되는지 확인
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 20-allow-from-openshift-ingress
  namespace: seokpan-app
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
